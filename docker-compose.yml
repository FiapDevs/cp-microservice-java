services:
  ponto-coleta-service:
    build:
      context: ./ponto-coleta-service
    container_name: cp-eco-ponto-coleta-service
    environment:
      DB_URL: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      DB_USERNAME: rm565537
      DB_PASSWORD: "050607"
      APP_USERNAME: admin
      APP_PASSWORD: admin123
    ports:
      - "8081:8081"

  residuo-service:
    build:
      context: ./residuo-service
    container_name: cp-eco-residuo-service
    depends_on:
      ponto-coleta-service:
        condition: service_started
    environment:
      DB_URL: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      DB_USERNAME: rm565537
      DB_PASSWORD: "050607"
      APP_USERNAME: admin
      APP_PASSWORD: admin123
    ports:
      - "8082:8082"

  coleta-service:
    build:
      context: ./coleta-service
    container_name: cp-eco-coleta-service
    depends_on:
      ponto-coleta-service:
        condition: service_started
      residuo-service:
        condition: service_started
    environment:
      DB_URL: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      DB_USERNAME: rm565537
      DB_PASSWORD: "050607"
      APP_USERNAME: admin
      APP_PASSWORD: admin123
    ports:
      - "8083:8083"
